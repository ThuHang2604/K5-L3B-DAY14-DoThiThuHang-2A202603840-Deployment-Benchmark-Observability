# Quality gate (Part 7 — Exercise 7.2 / Bài tập Bước 1.4)
# Chạy eval trên golden dataset mỗi khi có PR. run_eval.py trả exit code 1 khi
# accuracy < --min-accuracy hoặc có câu bị regression so với baseline → job đỏ.
# Bật "Require status checks to pass" cho nhánh main (Settings → Branches) để chặn merge.
name: eval-quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
  push:
    branches: [main]
    paths:
      - "06-lab-complete/benchmark-observability/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        env:
          AGENT_VERSION: v2
          PORT: "8002"
          MOCK_ERROR_RATE: "0"      # eval đo chất lượng, không đo lỗi upstream ngẫu nhiên
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8002/health && break
            sleep 1
          done

      - name: Run eval (quality gate)
        run: |
          BASELINE=../../../reports/eval_v2_fixed.json
          ARGS="--url http://localhost:8002 --min-accuracy 1.0 --out reports/eval_ci.json"
          if [ -f "$BASELINE" ]; then ARGS="$ARGS --baseline $BASELINE"; fi
          python eval/run_eval.py $ARGS

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
