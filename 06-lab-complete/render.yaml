# Render Blueprint — agent (Docker) + Redis (Key Value)
# Secret không ghi giá trị: AGENT_API_KEY dùng generateValue (Render tự sinh, xem trong Dashboard).
services:
  - type: web
    name: day14-production-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-agent-redis
          property: connectionString

  - type: keyvalue
    name: day14-agent-redis
    plan: free
    region: singapore
    ipAllowList: []          # chỉ cho service nội bộ trong Render truy cập
