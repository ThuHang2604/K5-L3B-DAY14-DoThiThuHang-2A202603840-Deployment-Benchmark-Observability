# Railway — build bằng Dockerfile, health check /health
# Biến môi trường đặt trên Railway (KHÔNG ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (=${{Redis.REDIS_URL}} từ plugin Redis), ENVIRONMENT=production
# PORT do Railway tự cấp; CMD trong Dockerfile đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
